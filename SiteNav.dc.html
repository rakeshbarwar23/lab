<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:relative;border-bottom:1px solid rgba(255,255,255,0.07);font-family:'Geist',sans-serif;">
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(7,12,22,0.78);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);pointer-events:none;"></div>
  <a href="#main" style="position:absolute;left:-9999px;top:10px;z-index:10;font-size:14px;font-weight:500;color:#070c16;background:#f1d49a;padding:10px 16px;border-radius:999px;text-decoration:none;" style-focus="left:16px;">Skip to content</a>
  <div style="position:relative;max-width:1360px;margin:0 auto;padding:0 clamp(16px,4vw,40px);height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;">
    <a href="Nayak Lab.dc.html" aria-label="Tapan Nayak Lab — home" style="display:flex;align-items:center;gap:14px;flex-shrink:0;text-decoration:none;border-radius:8px;">
      <span style="position:relative;display:block;height:34px;width:83px;flex:none;">
        <img src="assets/logos/tkn-logo-reversed.png" alt="TKN" style="width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(90deg,#000 14.2%,transparent 14.2%,transparent 18.2%,#000 18.2%);mask-image:linear-gradient(90deg,#000 14.2%,transparent 14.2%,transparent 18.2%,#000 18.2%);">
        <canvas data-tkn-ions="" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;"></canvas>
      </span>
      <span style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#8792a6;text-transform:uppercase;white-space:nowrap;">Tapan Nayak Lab / IIT Delhi</span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display:flex;gap:2px;">
        <sc-for list="{{ deskLinks }}" as="l" hint-placeholder-count="7">
          <sc-if value="{{ l.on }}" hint-placeholder-val="{{ false }}">
            <a href="{{ l.href }}" aria-current="page" style="font-size:13.5px;color:#070c16;background:#f1d49a;padding:9px 15px;border-radius:999px;white-space:nowrap;text-decoration:none;font-weight:500;">{{ l.label }}</a>
          </sc-if>
          <sc-if value="{{ l.off }}" hint-placeholder-val="{{ true }}">
            <a href="{{ l.href }}" style="font-size:13.5px;color:#aab3c3;padding:9px 15px;border-radius:999px;white-space:nowrap;text-decoration:none;transition:background .18s,color .18s;" style-hover="background:rgba(255,255,255,0.07);color:#fff;">{{ l.label }}</a>
          </sc-if>
        </sc-for>
      </nav>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button ref="{{ btnRef }}" onClick="{{ openMenu }}" aria-label="Open menu" aria-expanded="{{ expanded }}" aria-controls="site-drawer" style="width:48px;height:48px;margin-right:-8px;border:none;background:transparent;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;" style-hover="background:rgba(255,255,255,0.07);">
        <span style="display:block;width:22px;height:2px;border-radius:2px;background:#e8ecf3;"></span>
        <span style="display:block;width:22px;height:2px;border-radius:2px;background:#e8ecf3;"></span>
        <span style="display:block;width:14px;height:2px;border-radius:2px;background:#f1d49a;margin-left:8px;"></span>
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div id="site-drawer" ref="{{ drawerRef }}" role="dialog" aria-modal="true" aria-label="Site menu" onKeyDown="{{ trap }}" style="position:fixed;inset:0;z-index:1000;background:#070c16;display:flex;flex-direction:column;overflow-y:auto;font-family:'Geist',sans-serif;">
      <div style="height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,40px);border-bottom:1px solid rgba(255,255,255,0.07);">
        <span style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#8792a6;text-transform:uppercase;">Menu</span>
        <button onClick="{{ closeMenu }}" aria-label="Close menu" style="width:48px;height:48px;margin-right:-8px;border:none;background:transparent;border-radius:12px;cursor:pointer;color:#e8ecf3;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;" style-hover="background:rgba(255,255,255,0.07);">×</button>
      </div>
      <nav aria-label="Main" style="display:flex;flex-direction:column;padding:clamp(20px,4vw,36px) clamp(16px,4vw,40px);flex:1;">
        <a href="Nayak Lab.dc.html" style="display:flex;justify-content:space-between;align-items:center;min-height:64px;font-size:clamp(28px,7vw,40px);font-weight:500;letter-spacing:-0.03em;color:#e8ecf3;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.07);">Home<span style="font-family:'Geist Mono',monospace;font-size:12px;color:#7d889c;">00</span></a>
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
          <a href="{{ l.href }}" style="display:flex;justify-content:space-between;align-items:center;min-height:64px;font-size:clamp(28px,7vw,40px);font-weight:500;letter-spacing:-0.03em;color:{{ l.color }};text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.07);">{{ l.label }}<span style="font-family:'Geist Mono',monospace;font-size:12px;color:#7d889c;">{{ l.n }}</span></a>
        </sc-for>
      </nav>
      <div style="padding:24px clamp(16px,4vw,40px) 36px;display:flex;flex-direction:column;gap:18px;border-top:1px solid rgba(255,255,255,0.07);">
        <span style="position:relative;display:block;height:56px;width:137px;flex:none;">
          <img src="assets/logos/tkn-logo-reversed.png" alt="TKN" style="width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(90deg,#000 14.2%,transparent 14.2%,transparent 18.2%,#000 18.2%);mask-image:linear-gradient(90deg,#000 14.2%,transparent 14.2%,transparent 18.2%,#000 18.2%);">
          <canvas data-tkn-ions="" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;"></canvas>
        </span>
        <a href="mailto:tnayak@bioschool.iitd.ac.in" style="font-size:16px;color:#f1d49a;text-decoration:none;min-height:44px;display:flex;align-items:center;">tnayak@bioschool.iitd.ac.in</a>
        <span style="font-family:'Geist Mono',monospace;font-size:11.5px;color:#7d889c;">Kusuma School of Biological Sciences · IIT Delhi</span>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;research&quot;,&quot;publications&quot;,&quot;people&quot;,&quot;teaching&quot;,&quot;gallery&quot;,&quot;join&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1200, open: false };
  btnRef = React.createRef();
  drawerRef = React.createRef();
  componentDidMount() {
    this._r = () => { const w = window.innerWidth; if (w !== this.state.w) { if (w >= 960 && this.state.open) this.close(); this.setState({ w }); } };
    window.addEventListener('resize', this._r);
    this._k = (e) => { if (e.key === 'Escape' && this.state.open) this.close(); };
    window.addEventListener('keydown', this._k);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); window.removeEventListener('keydown', this._k); document.body.style.overflow = ''; }
  open() {
    this.setState({ open: true });
    const go = (n) => { const d = document.getElementById('site-drawer'); if (d) { document.body.style.overflow = 'hidden'; const b = d.querySelector('button,a'); b && b.focus(); } else if (n < 20) requestAnimationFrame(() => go(n + 1)); };
    requestAnimationFrame(() => go(0));
  }
  close() {
    this.setState({ open: false });
    document.body.style.overflow = '';
    requestAnimationFrame(() => { const b = this.btnRef.current || document.querySelector('header button[aria-label="Open menu"]'); b && b.focus(); });
  }
  renderVals() {
    const a = this.props.active || '';
    const L = [['research', 'Research', 'Research.dc.html'], ['publications', 'Publications', 'Publications.dc.html'], ['people', 'People', 'People.dc.html'], ['teaching', 'Teaching', 'Teaching.dc.html'], ['gallery', 'Gallery', 'Gallery.dc.html'], ['join', 'Join us', 'Join.dc.html']];
    const mobile = this.state.w < 960;
    return {
      links: L.map(([k, label, href], i) => ({ label, href, on: k === a, off: k !== a, n: '0' + (i + 1), color: k === a ? '#f1d49a' : '#e8ecf3' })),
      deskLinks: [{ label: 'Home', href: 'Nayak Lab.dc.html', on: a === '', off: a !== '' }, ...L.map(([k, label, href]) => ({ label, href, on: k === a, off: k !== a }))],
      desktop: !mobile, mobile, open: mobile && this.state.open, expanded: this.state.open ? 'true' : 'false',
      btnRef: this.btnRef, drawerRef: this.drawerRef,
      openMenu: () => this.open(),
      closeMenu: () => this.close(),
      trap: (e) => {
        const d = document.getElementById('site-drawer');
        if (e.key !== 'Tab' || !d) return;
        const f = [...d.querySelectorAll('a,button')];
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      },
    };
  }
}
</script>
</body>
</html>
