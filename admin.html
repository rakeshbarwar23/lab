<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nayak Lab · Content Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Loads the current content so the editor starts from what's live -->
<script src="./content.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#0c2340;--brown:#8a5410;--bg:#f6f4ef;--line:#e3ddd2;--ink:#1a1f2b;--mut:#5c6470;}
  body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  a{color:var(--brown);}
  /* top bar */
  .top{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:14px clamp(16px,3vw,28px);box-shadow:0 8px 24px -16px rgba(0,0,0,.5);}
  .top .brand{font-family:'Spectral',serif;font-weight:600;font-size:19px;}
  .top .mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#e6b667;}
  .top .sp{flex:1;}
  .btn{font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:600;border:none;border-radius:8px;padding:11px 18px;cursor:pointer;transition:transform .12s,background .15s,box-shadow .15s;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:#fff;color:var(--navy);}
  .btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.3);}
  .btn-ghost:hover{background:rgba(255,255,255,.16);}
  .wrap{display:grid;grid-template-columns:230px 1fr;gap:0;max-width:1180px;margin:0 auto;align-items:start;}
  /* sidebar */
  .side{position:sticky;top:66px;padding:24px 14px;align-self:start;}
  .side button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:none;border:none;text-align:left;font-family:inherit;font-size:14.5px;color:var(--mut);padding:11px 14px;border-radius:9px;cursor:pointer;margin-bottom:2px;font-weight:500;}
  .side button:hover{background:#ece7dd;color:var(--navy);}
  .side button.on{background:var(--navy);color:#fff;}
  .side .n{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.7;}
  .side button.on .n{opacity:.85;}
  /* main */
  .main{padding:24px clamp(16px,3vw,32px) 120px;min-height:80vh;}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .head h1{font-family:'Spectral',serif;font-weight:600;font-size:28px;color:var(--navy);}
  .head p{font-size:13.5px;color:var(--mut);font-weight:300;max-width:560px;margin-top:6px;}
  .addbar{margin:18px 0;}
  .card{background:#fff;border:1px solid #e9e3d8;border-radius:14px;padding:18px 18px 6px;margin-bottom:16px;box-shadow:0 1px 0 rgba(12,35,64,.02);}
  .card-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .card-h .idx{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#b0a691;width:26px;flex:0 0 auto;}
  .card-h strong{font-family:'Spectral',serif;font-weight:600;font-size:16px;color:var(--navy);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ops{display:flex;gap:6px;flex:0 0 auto;}
  .ops button{font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid var(--line);background:#f6f4ef;color:var(--mut);border-radius:7px;padding:6px 9px;cursor:pointer;line-height:1;}
  .ops button:hover{background:#ece7dd;color:var(--navy);}
  .ops .del:hover{background:#f7e3df;color:#9a2b1e;border-color:#e6c3bc;}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding-bottom:14px;}
  .fld{display:flex;flex-direction:column;gap:5px;}
  .fld.full{grid-column:1 / -1;}
  .fld>span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9a927f;}
  .fld input,.fld textarea,.fld select{font-family:inherit;font-size:14px;color:var(--ink);background:#fbfaf7;border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;resize:vertical;}
  .fld textarea{min-height:64px;line-height:1.5;}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--brown);background:#fff;}
  .imgrow{display:flex;gap:12px;align-items:flex-start;}
  .imgrow .col{flex:1;min-width:0;}
  .prev{width:60px;height:60px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:#f1eee7 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="%23c9bfac"><path d="M4 5h16v14H4z" fill="none" stroke="%23c9bfac" stroke-width="1.5"/></svg>') center/22px no-repeat;object-fit:cover;overflow:hidden;}
  .hint{font-size:12px;color:var(--mut);font-weight:300;line-height:1.55;background:#efeae0;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:18px;}
  .hint b{color:var(--navy);font-weight:600;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-size:14px;font-weight:500;padding:13px 22px;border-radius:10px;box-shadow:0 20px 40px -18px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:100;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
  .gal-card{background:#fff;border:1px solid #e9e3d8;border-radius:12px;padding:12px;}
  .gal-card .prev{width:100%;height:110px;margin-bottom:10px;border-radius:9px;}
  .gal-card input{font-family:'IBM Plex Mono',monospace;font-size:12px;width:100%;background:#fbfaf7;border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin-bottom:8px;}
  .gal-card .ops{justify-content:space-between;}
  @media(max-width:820px){.wrap{grid-template-columns:1fr;}.side{position:static;display:flex;flex-wrap:wrap;gap:6px;padding:14px;}.side button{width:auto;}.fields{grid-template-columns:1fr;}}
  input[type=file]{display:none;}
</style>
</head>
<body>
<div class="top">
  <div>
    <div class="mono">Nayak Lab</div>
    <div class="brand">Content Editor</div>
  </div>
  <div class="sp"></div>
  <label class="btn btn-ghost" for="importFile" title="Load an existing content.js">Import file</label>
  <input type="file" id="importFile" accept=".js,.json,text/javascript">
  <button class="btn btn-ghost" id="copyBtn">Copy</button>
  <button class="btn btn-primary" id="dlBtn">Download content.js ↓</button>
</div>

<div class="wrap">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------------- data --- */
const DEF = { people:[], publications:[], publicationsOther:[], news:[], research:[], gallery:[], positions:[] };
let data = JSON.parse(JSON.stringify(Object.assign({}, DEF, window.LAB_CONTENT || {})));
for (const k in DEF) if (!Array.isArray(data[k])) data[k] = [];

/* --------------------------------------------------------------- config --- */
const SECTIONS = {
  people: {
    label: 'People', title: it => it.name || '(new person)',
    blank: { status:'current', name:'', role:'', img:'', bio:'', past:'' },
    fields: [
      { k:'status', type:'select', opts:['current','alumni'], label:'Section' },
      { k:'role',   type:'text',   label:'Role' },
      { k:'name',   type:'text',   label:'Name', full:true },
      { k:'img',    type:'image',  label:'Photo (path in assets/people/)', full:true },
      { k:'bio',    type:'textarea', label:'Bio', full:true },
      { k:'past',   type:'textarea', label:'Past / education (one item per line)', full:true },
    ],
  },
  publications: {
    label: 'Publications', title: it => it.title || '(new paper)',
    blank: { year:'', title:'', authors:'', venue:'', url:'' },
    fields: [
      { k:'year',   type:'text', label:'Year (or range e.g. 2007–2011)' },
      { k:'venue',  type:'text', label:'Journal / venue' },
      { k:'title',  type:'text', label:'Title', full:true },
      { k:'authors',type:'text', label:'Authors', full:true },
      { k:'url',    type:'text', label:'Link (DOI / URL)', full:true },
    ],
  },
  publicationsOther: {
    label: 'Book / Under review', title: it => it.title || '(new entry)',
    blank: { title:'', authors:'', venue:'' },
    fields: [
      { k:'title',  type:'text', label:'Title', full:true },
      { k:'authors',type:'text', label:'Authors', full:true },
      { k:'venue',  type:'text', label:'Venue / status', full:true },
    ],
  },
  news: {
    label: 'Lab updates', title: it => (it.text||'').slice(0,60) || '(new update)',
    blank: { date:'', tag:'Research', text:'' },
    fields: [
      { k:'date', type:'text', label:'Date / year' },
      { k:'tag',  type:'text', label:'Tag (Research, Publication, People, Talk, Grant…)' },
      { k:'text', type:'textarea', label:'Update', full:true },
    ],
  },
  research: {
    label: 'Research themes', title: it => it.title || '(new theme)',
    blank: { img:'', tag:'', title:'', blurb:'' },
    fields: [
      { k:'tag',   type:'text', label:'Tag' },
      { k:'title', type:'text', label:'Title' },
      { k:'img',   type:'image', label:'Image (path in assets/research/)', full:true },
      { k:'blurb', type:'textarea', label:'Short description', full:true },
    ],
  },
  gallery: { label: 'Gallery', gallery:true },
  positions: {
    label: 'Open positions', title: it => it.title || '(new position)',
    blank: { title:'', status:'Open', desc:'' },
    fields: [
      { k:'title',  type:'text', label:'Position title' },
      { k:'status', type:'text', label:'Status  (type "Closed" to grey it out; else Open / Rolling / Enquire)' },
      { k:'desc',   type:'textarea', label:'Description', full:true },
    ],
  },
};
const ORDER = ['people','publications','publicationsOther','news','research','gallery','positions'];
let tab = 'people';

/* -------------------------------------------------------------- helpers --- */
const esc  = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA = s => esc(s).replace(/"/g,'&quot;');
const $ = sel => document.querySelector(sel);

function renderSide(){
  $('#side').innerHTML = ORDER.map(k =>
    `<button data-tab="${k}" class="${k===tab?'on':''}">${SECTIONS[k].label}<span class="n">${data[k].length}</span></button>`
  ).join('');
}

const HINTS = {
  people: 'Set <b>Section</b> to <b>alumni</b> to move someone from the current team into the alumni list — nothing else needs to change. Leave the photo blank to show their initials instead.',
  publications: 'New papers appear on the Publications page grouped by year, and the four most recent also show as “Recent work” on the homepage.',
  gallery: 'The <b>first</b> image is the large featured photo on the gallery page. Reorder with the arrows. Put the actual image files in <b>assets/gallery/</b> on the server.',
  positions: 'Type <b>Closed</b> as the status to automatically grey out a position without deleting it.',
};

function fieldHTML(sec, idx, item, f){
  const id = `data-sec="${sec}" data-idx="${idx}" data-field="${f.k}" data-type="${f.type}"`;
  const cls = 'fld' + (f.full ? ' full' : '');
  let control;
  if (f.type === 'textarea')
    control = `<textarea ${id}>${esc(item[f.k])}</textarea>`;
  else if (f.type === 'select')
    control = `<select ${id}>` + f.opts.map(o=>`<option ${o===item[f.k]?'selected':''}>${o}</option>`).join('') + `</select>`;
  else if (f.type === 'image')
    return `<label class="${cls}"><span>${f.label}</span><div class="imgrow">`
         + `<div class="prev" data-prev-for="${sec}-${idx}"${item[f.k]?` style="background-image:url('${escA(item[f.k])}');background-size:cover;background-position:center;"`:''}></div>`
         + `<div class="col"><input type="text" ${id} value="${escA(item[f.k])}" placeholder="assets/…"></div></div></label>`;
  else
    control = `<input type="text" ${id} value="${escA(item[f.k])}">`;
  return `<label class="${cls}"><span>${f.label}</span>${control}</label>`;
}

function renderMain(){
  const cfg = SECTIONS[tab];
  const arr = data[tab];
  let html = `<div class="head"><div><h1>${cfg.label}</h1>`
    + `<p>${cfg.gallery?'Photos shown on the gallery page and homepage.':'Add, edit, reorder or remove entries. Changes are saved into the file you download.'}</p></div>`
    + `<button class="btn btn-primary" data-add="${tab}">+ Add ${cfg.gallery?'photo':'entry'}</button></div>`;
  if (HINTS[tab]) html += `<div class="hint">${HINTS[tab]}</div>`;

  if (cfg.gallery){
    html += `<div class="gal-grid">` + arr.map((src,i)=>
      `<div class="gal-card"><div class="prev" data-prev-for="gallery-${i}"${src?` style="background-image:url('${escA(src)}');background-size:cover;background-position:center;"`:''}></div>`
      + `<input type="text" data-sec="gallery" data-idx="${i}" data-field="" data-type="image" value="${escA(src)}" placeholder="assets/gallery/…">`
      + `<div class="ops"><button data-act="up" data-sec="gallery" data-idx="${i}">↑</button>`
      + `<button data-act="down" data-sec="gallery" data-idx="${i}">↓</button>`
      + `<button class="del" data-act="del" data-sec="gallery" data-idx="${i}">Delete</button></div></div>`
    ).join('') + `</div>`;
  } else {
    html += arr.map((item,i)=>
      `<div class="card"><div class="card-h"><span class="idx">${String(i+1).padStart(2,'0')}</span>`
      + `<strong>${esc(cfg.title(item))}</strong><div class="ops">`
      + `<button data-act="up" data-sec="${tab}" data-idx="${i}">↑</button>`
      + `<button data-act="down" data-sec="${tab}" data-idx="${i}">↓</button>`
      + `<button class="del" data-act="del" data-sec="${tab}" data-idx="${i}">Delete</button></div></div>`
      + `<div class="fields">` + cfg.fields.map(f=>fieldHTML(tab,i,item,f)).join('') + `</div></div>`
    ).join('');
    if (!arr.length) html += `<div class="hint">No entries yet — click “+ Add entry”.</div>`;
  }
  $('#main').innerHTML = html;
}

function render(){ renderSide(); renderMain(); }

/* --------------------------------------------------------------- events --- */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.field === undefined) return;
  const sec = el.dataset.sec, idx = +el.dataset.idx;
  if (sec === 'gallery') data.gallery[idx] = el.value;
  else data[sec][idx][el.dataset.field] = el.value;
  if (el.dataset.type === 'image'){
    const p = document.querySelector(`[data-prev-for="${sec}-${idx}"]`);
    if (p){ if(el.value){ p.style.backgroundImage=`url('${el.value.replace(/'/g,"%27")}')`; p.style.backgroundSize='cover'; p.style.backgroundPosition='center'; } else p.style.backgroundImage=''; }
  }
  renderSide(); // keep counts / nothing heavy
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.tagName === 'SELECT' && el.dataset.field !== undefined){
    data[el.dataset.sec][+el.dataset.idx][el.dataset.field] = el.value;
    renderMain();
  }
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-add],[data-act]');
  if (!t) return;
  if (t.dataset.tab){ tab = t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (t.dataset.add){
    const sec = t.dataset.add;
    data[sec].push(SECTIONS[sec].gallery ? '' : JSON.parse(JSON.stringify(SECTIONS[sec].blank)));
    renderMain(); renderSide();
    return;
  }
  const sec = t.dataset.sec, i = +t.dataset.idx, arr = data[sec];
  if (t.dataset.act === 'del'){
    const nm = SECTIONS[sec].gallery ? 'this photo' : `“${SECTIONS[sec].title(arr[i])}”`;
    if (confirm(`Delete ${nm}?`)){ arr.splice(i,1); renderMain(); renderSide(); }
  } else if (t.dataset.act === 'up' && i>0){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; renderMain(); }
  else if (t.dataset.act === 'down' && i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; renderMain(); }
});

/* ------------------------------------------------------------- generate --- */
const HEADER =
`/* ============================================================================
   NAYAK LAB — WEBSITE CONTENT   (generated by admin.html)
   Upload this file to the server, replacing the old content.js, to publish.
   To edit again later, open admin.html and click "Import file" to load this.
   ============================================================================ */
`;
function serialize(){ return HEADER + 'window.LAB_CONTENT = ' + JSON.stringify(data, null, 2) + ';\n'; }

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

$('#dlBtn').addEventListener('click', () => {
  const blob = new Blob([serialize()], {type:'text/javascript'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'content.js';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('content.js downloaded — upload it to the server');
});

$('#copyBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(serialize()); toast('Copied content.js to clipboard'); }
  catch(err){ toast('Copy failed — use Download instead'); }
});

$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  const txt = await file.text();
  let obj = null;
  try { const i=txt.indexOf('{'), j=txt.lastIndexOf('}'); obj = JSON.parse(txt.slice(i,j+1)); }
  catch(_){ try { obj = (new Function(txt + '\n;return window.LAB_CONTENT;'))(); } catch(__){ obj = null; } }
  if (!obj || typeof obj !== 'object'){ toast('Could not read that file'); e.target.value=''; return; }
  data = JSON.parse(JSON.stringify(Object.assign({}, DEF, obj)));
  for (const k in DEF) if (!Array.isArray(data[k])) data[k] = [];
  render(); toast('Loaded ' + file.name);
  e.target.value = '';
});

/* ---------------------------------------------------------------- start --- */
render();
</script>
</body>
</html>
